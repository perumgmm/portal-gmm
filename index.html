  <!-- MODULE CLOUD FIRESTORE & MULTI-DOCUMENT REAL-TIME ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, onSnapshot, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const bc = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("gmm_realtime_channel_v45") : null;

    let db = null;
    let auth = null;
    let currentUserAuth = null;
    let stateColRef = null;
    let isCloudActive = false;
    let memoryCache = {};
    let lastCloudTimestamp = 0;

    // Pembagian dokumen (Sharding) di dalam koleksi gmm_master_state agar tidak pernah melewati batas 1MB Firestore
    const SHARD_DOCS = {
      core: ["appConfig", "unitsData"],
      finance: ["kasPaguyuban", "kasDKM"],
      security: ["paketList", "tamuList", "patroliList", "rondaList", "inventarisList", "suratList"],
      community: ["aduanList", "kajianList", "kegiatanWargaList", "komunitasList", "lapakItems", "pollsList"]
    };

    async function initCloudEngine() {
      try {
        const rawConfig = typeof __firebase_config !== "undefined" ? __firebase_config : null;
        if (!rawConfig) return;
        const parsedConfig = typeof rawConfig === "string" ? JSON.parse(rawConfig) : rawConfig;
        if (!parsedConfig || !parsedConfig.apiKey || String(parsedConfig.apiKey).includes("PLACEHOLDER")) return;

        setLogLevel("silent");
        const app = initializeApp(parsedConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        const appId = typeof __app_id !== "undefined" && __app_id ? __app_id : "grande-mulia-mekarwangi";

        // RULE 3: Auth Before Queries
        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (u) => {
          currentUserAuth = u;
        });
        currentUserAuth = auth.currentUser;

        // RULE 1: Strict Path /artifacts/{appId}/public/data/gmm_master_state
        stateColRef = collection(db, "artifacts", appId, "public", "data", "gmm_master_state");
        isCloudActive = true;
      } catch (e) {
        isCloudActive = false;
      }
    }

    const readyPromise = initCloudEngine();

    window.GMM_CLOUD = {
      isCloudConnected() {
        return isCloudActive && !!currentUserAuth;
      },

      async loadState() {
        await readyPromise;
        if (isCloudActive && stateColRef && auth?.currentUser) {
          try {
            const snap = await getDocs(stateColRef);
            const combined = {};
            let foundAny = false;
            snap.forEach((docSnap) => {
              const d = docSnap.data();
              if (d && typeof d === "object") {
                foundAny = true;
                Object.assign(combined, d);
                if ((d.updatedAt || 0) > lastCloudTimestamp) {
                  lastCloudTimestamp = d.updatedAt || 0;
                }
              }
            });
            if (foundAny) {
              memoryCache = combined;
              return combined;
            }
          } catch (e) {}
        }
        return Object.keys(memoryCache).length ? memoryCache : null;
      },

      async saveState(payload, onStatus) {
        const nowTs = Date.now();
        lastCloudTimestamp = nowTs;
        const stamped = { ...payload, updatedAt: nowTs, updatedByUid: auth?.currentUser?.uid || "system" };
        memoryCache = stamped;

        try {
          if (bc) bc.postMessage(stamped);
        } catch (e) {}

        await readyPromise;
        if (!auth?.currentUser) {
          if (onStatus) onStatus("local_ready");
          return false;
        }

        if (isCloudActive && stateColRef) {
          try {
            if (onStatus) onStatus("syncing");
            const appId = typeof __app_id !== "undefined" && __app_id ? __app_id : "grande-mulia-mekarwangi";

            // Simpan ke 4 dokumen terpisah secara paralel agar aman dari batas 1MB Firestore
            const writePromises = Object.entries(SHARD_DOCS).map(([shardKey, keysList]) => {
              const shardPayload = { updatedAt: nowTs, updatedByUid: auth?.currentUser?.uid || "system" };
              keysList.forEach((k) => {
                if (payload[k] !== undefined) shardPayload[k] = payload[k];
              });
              const docRef = doc(db, "artifacts", appId, "public", "data", "gmm_master_state", `v45_${shardKey}`);
              return setDoc(docRef, shardPayload, { merge: true });
            });

            await Promise.all(writePromises);
            if (onStatus) onStatus("synced");
            return true;
          } catch (e) {
            if (onStatus) onStatus("local_ready");
            return false;
          }
        } else {
          if (onStatus) onStatus("local_ready");
          return true;
        }
      },

      subscribe(callback) {
        if (bc) {
          bc.onmessage = (ev) => {
            if (ev.data && (ev.data.updatedAt || 0) > lastCloudTimestamp) {
              lastCloudTimestamp = ev.data.updatedAt;
              memoryCache = { ...memoryCache, ...ev.data };
              callback(memoryCache);
            }
          };
        }

        let unsubFirestore = null;
        readyPromise.then(() => {
          if (isCloudActive && stateColRef && auth?.currentUser) {
            try {
              unsubFirestore = onSnapshot(
                stateColRef,
                (colSnap) => {
                  let hasNewer = false;
                  const incoming = { ...memoryCache };
                  colSnap.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data) {
                      Object.assign(incoming, data);
                      if ((data.updatedAt || 0) > lastCloudTimestamp) {
                        lastCloudTimestamp = data.updatedAt;
                        hasNewer = true;
                      }
                    }
                  });
                  if (hasNewer) {
                    memoryCache = incoming;
                    callback(incoming);
                  }
                },
                (err) => {
                  // Error callback wajib untuk onSnapshot agar tidak gagal diam-diam
                  console.warn("Firestore sync listener warning:", err?.message || err);
                }
              );
            } catch (e) {}
          }
        });

        return () => {
          if (unsubFirestore) unsubFirestore();
        };
      }
    };
  </script>

      const str = String(plain || "");
      if (str.startsWith("ENC#")) return str;
      let h1 = 0xdeadbeef ^ str.length;
      let h2 = 0x41c6ce57 ^ str.length;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      const hex = (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0");
      return "ENC#" + hex.toUpperCase().slice(0, 12);
    };

    const compressImageFile = (file, callback) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxDim = 640;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", 0.65));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

        if (!unitObj) return 150000;

        let total = 0;
        if (comp.keamanan) total += Number(appConfig.tarifKeamanan || 100000);
        if (comp.kebersihan) total += Number(appConfig.tarifKebersihan || 35000);
        if (comp.kas) total += Number(appConfig.tarifKas || 15000);
        return total;
      };

      const activeBillingUnit = useMemo(() => {
        if (viewMode === "warga" && currentUser && !currentUser.isHiddenSystem) {
          return visibleUnitsData.find((u) => u.id === currentUser.id || u.unit === currentUser.unit) || visibleUnitsData[0] || SAMPLE_WARGA[0];
        }
        return visibleUnitsData.find((u) => String(u.id) === String(selectedBillingUnitId)) || visibleUnitsData[0] || SAMPLE_WARGA[0];
      }, [visibleUnitsData, selectedBillingUnitId, currentUser, viewMode]);

      // Daftar antrian pembayaran IPL yang menunggu persetujuan Admin
      const pendingApprovalsList = useMemo(() => {
        const list = [];
        visibleUnitsData.forEach((u) => {
          ["2025", "2026", "2027"].forEach((yr) => {
            const mMap = u[`months${yr}`] || {};
            const pmMap = u[`paymentMethods${yr}`] || {};
            const pfMap = u[`paymentProofs${yr}`] || {};
            MONTHS_LIST.forEach((m) => {
              if (mMap[m] === "Menunggu Verifikasi") {
                list.push({
                  unitId: u.id,
                  unit: u.unit,
                  owner: u.owner,
                  year: yr,
                  month: m,
                  method: pmMap[m] || "QRIS",
                  proof: pfMap[m] || "",
                  nominal: calculateUnitIPLAmount(u)
                });
              }
            });
          });
        });
        return list;
      }, [visibleUnitsData, appConfig]);

      const billingSummary = useMemo(() => {
        const mMap = activeBillingUnit?.[`months${selectedBillingYear}`] || {};
        const tarif = calculateUnitIPLAmount(activeBillingUnit);
        let lunasCount = 0;
        let pendingCount = 0;
        let nunggakCount = 0;
        let belumCount = 0;
        MONTHS_LIST.forEach((m) => {
          const s = mMap[m] || "Belum Jatuh Tempo";
          if (s === "Lunas") lunasCount++;
          else if (s === "Menunggu Verifikasi") pendingCount++;
          else if (s === "Nunggak") nunggakCount++;
          else belumCount++;
        });
        return {
          tarif,
          lunasCount,
          pendingCount,
          nunggakCount,
          belumCount,
          totalTerbayar: lunasCount * tarif,
          totalTunggakan: (nunggakCount + pendingCount) * tarif,
          targetTahunan: 12 * tarif
        };
      }, [activeBillingUnit, selectedBillingYear, appConfig]);

      const nextPrayerInfo = useMemo(() => {
        const list = [
          { name: "Subuh", time: appConfig.sholatSubuh || "04:18" },
          { name: "Dzuhur", time: appConfig.sholatDzuhur || "11:46" },
          { name: "Ashar", time: appConfig.sholatAshar || "15:01" },
          { name: "Maghrib", time: appConfig.sholatMaghrib || "17:56" },
          { name: "Isya", time: appConfig.sholatIsya || "19:06" }
        ];
        const now = new Date();
        const curMin = now.getHours() * 60 + now.getMinutes();
        for (const item of list) {
          const [hh, mm] = String(item.time).split(":").map(Number);
          const targetMin = (hh || 0) * 60 + (mm || 0);
          if (targetMin > curMin) return { ...item, list };
        }
        return { ...list[0], list };
      }, [appConfig, clockStr]);

      const totalSaldoPaguyuban = useMemo(() => {
        return kasPaguyuban.reduce((acc, item) => item.tipe === "Masuk" ? acc + Number(item.nominal || 0) : acc - Number(item.nominal || 0), 0);
      }, [kasPaguyuban]);

      const totalSaldoDKM = useMemo(() => {
        return kasDKM.reduce((acc, item) => item.tipe === "Masuk" ? acc + Number(item.nominal || 0) : acc - Number(item.nominal || 0), 0);
      }, [kasDKM]);

      // Filter Periode untuk Tab Laporan
      const matchesReportFilter = (item) => {
        const iso = item.tanggalISO || "";
        const todayISO = getLocalTodayISO();
        const curMonthPrefix = todayISO.slice(0, 7);
        if (reportPeriod === "hari_ini" && iso !== todayISO) return false;
        if (reportPeriod === "bulan_ini" && !String(iso).startsWith(curMonthPrefix)) return false;
        if (reportPeriod === "tanggal" && reportCustomDate && iso !== reportCustomDate) return false;
        if (reportSearch) {
          return JSON.stringify(item).toLowerCase().includes(reportSearch.toLowerCase());
        }
        return true;
      };

      const handleExportCSV = () => {
        let rows = [];
        if (reportCat === "patroli") rows = patroliList.filter(matchesReportFilter);
        else if (reportCat === "ronda") rows = rondaList.filter(matchesReportFilter);
        else if (reportCat === "pos1") rows = [...paketList.filter(matchesReportFilter), ...tamuList.filter(matchesReportFilter)];
        else if (reportCat === "inventaris") rows = inventarisList.filter(matchesReportFilter);
        else if (reportCat === "surat") rows = suratList.filter(matchesReportFilter);

        if (!rows.length) {
          showToast("Tidak ada data laporan untuk diekspor");
          return;
        }
        const headers = Object.keys(rows[0]).filter((k) => k !== "foto" && k !== "fotoAmbilSelfie");
        const csvLines = [
          headers.join(","),
          ...rows.map((r) => headers.map((h) => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(","))
        ];
        const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Laporan_${reportCat}_GMM_${getLocalTodayISO()}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast("File CSV Laporan berhasil diunduh");
      };

      // Authentication Handlers (Enkripsi Hash & Sinkronisasi Langsung Cloud Lintas Perangkat)
      const handleLogin = async (e) => {
        e.preventDefault();
        const cleanPhone = String(loginPhone).trim();
        const cleanPass = String(loginPass).trim();

        let allUnits = ensureMasterAdmin(unitsData);
        let found = allUnits.find(
          (u) => String(u.phone).trim() === cleanPhone && verifySecret(cleanPass, u.password)
        );

        // Jika belum ditemukan di cache memori, tarik data induk terbaru dari Cloud Firestore (untuk akun yang baru dibuat di perangkat lain)
        if (!found && window.GMM_CLOUD && typeof window.GMM_CLOUD.loadState === "function") {
          try {
            const latestCloud = await window.GMM_CLOUD.loadState();
            if (latestCloud && Array.isArray(latestCloud.unitsData)) {
              const syncedUnits = ensureMasterAdmin(latestCloud.unitsData);
              setUnitsData(syncedUnits);
              found = syncedUnits.find(
                (u) => String(u.phone).trim() === cleanPhone && verifySecret(cleanPass, u.password)
              );
            }
          } catch (err) {}
        }

        if (!found) {
          setLoginError("Nomor WhatsApp atau Kata Sandi tidak sesuai.");
          return;
        }
        setLoginError("");
        setCurrentUser(found);
        const visibleList = allUnits.filter((u) => !u.isHiddenSystem && String(u.phone).trim() !== MASTER_ADMIN.phone);
        setSelectedBillingUnitId(found.isHiddenSystem ? (visibleList[0]?.id || 101) : found.id);
        triggerSuccessPopup("Berhasil Masuk", `${found.owner} (${found.unit})`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setLoginPhone("");
        setLoginPass("");
        setActiveTab("beranda");
      };

      // Update IPL Month Status & Persetujuan Admin
      const handleUpdateMonthIPL = (unitId, yearStr, monthName, newStatus, methodStr, proofImgBase64 = null) => {
        const targetUnit = unitsData.find((u) => String(u.id) === String(unitId));
        if (!targetUnit) return;
        const nominalIPL = calculateUnitIPLAmount(targetUnit);
        const refKey = `IPL-${unitId}-${yearStr}-${monthName}`;
        const todayISO = getLocalTodayISO();

        setUnitsData((prev) =>
          prev.map((u) => {
            if (String(u.id) !== String(unitId)) return u;
            const mKey = `months${yearStr}`;
            const pmKey = `paymentMethods${yearStr}`;
            const pfKey = `paymentProofs${yearStr}`;
            const pdKey = `paidDates${yearStr}`;
            return {
              ...u,
              [mKey]: { ...(u[mKey] || buildDefaultMonthsMap()), [monthName]: newStatus },
              [pmKey]: { ...(u[pmKey] || buildDefaultMonthsMap("-")), [monthName]: methodStr || selectedPayMethod },
              [pfKey]: proofImgBase64 ? { ...(u[pfKey] || {}), [monthName]: proofImgBase64 } : (u[pfKey] || {}),
              [pdKey]: newStatus === "Lunas" ? { ...(u[pdKey] || {}), [monthName]: todayISO } : (u[pdKey] || {})
            };
          })
        );

        if (newStatus === "Lunas") {
          setKasPaguyuban((prev) => {
            const filtered = prev.filter((k) => k.refId !== refKey);
            return [
              {
                id: "kas-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
                tanggal: todayISO,
                tipe: "Masuk",
                kategori: "Iuran IPL Warga (Disetujui Admin)",
                nominal: nominalIPL,
                ket: `Pelunasan IPL ${monthName} ${yearStr} - Unit ${targetUnit.unit} (${targetUnit.owner}) via ${methodStr || selectedPayMethod}`,
                refId: refKey
              },
              ...filtered
            ];
          });
          triggerSuccessPopup("Pembayaran IPL Disetujui (Lunas)", `${monthName} ${yearStr} (${targetUnit.unit}) resmi tercatat di Buku Kas`);
        } else {
          setKasPaguyuban((prev) => prev.filter((k) => k.refId !== refKey));
          if (newStatus === "Menunggu Verifikasi") {
            triggerSuccessPopup("Konfirmasi Terkirim ke Admin", `Tagihan ${monthName} ${yearStr} menunggu persetujuan Admin`);
          } else {
            showToast(`Status ${monthName} ${yearStr} diubah ke ${newStatus}`);
          }
        }
      };

      const handleBulkRapelPay = () => {
        if (!activeBillingUnit) return;
        const start = Math.min(rapelStartIdx, rapelEndIdx);
        const end = Math.max(rapelStartIdx, rapelEndIdx);
        const selectedMonths = MONTHS_LIST.slice(start, end + 1);
        const statusToApply = isAdminOrDKM ? "Lunas" : "Menunggu Verifikasi";
        selectedMonths.forEach((m) => {
          handleUpdateMonthIPL(activeBillingUnit.id, selectedBillingYear, m, statusToApply, selectedPayMethod);
        });
        triggerSuccessPopup(
          isAdminOrDKM ? "Pelunasan Rapel Disetujui" : "Konfirmasi Rapel Terkirim",
          `${selectedMonths.length} Bulan (${selectedMonths[0]} - ${selectedMonths[selectedMonths.length - 1]}) diset ${statusToApply}`
        );
      };

      // Toggle Ceklis Pelerek Warga
      const handleTogglePelerek = (unitId, checked, ketText) => {
        setUnitsData((prev) =>
          prev.map((u) =>
            u.id === unitId
              ? { ...u, sediakanPelerek: checked, ketPelerek: ketText !== undefined ? ketText : (u.ketPelerek || "Tersedia makanan/minuman ronda di teras rumah") }
              : u
          )
        );
        showToast(checked ? "Rumah Anda ditandai menyediakan Pelerek Ronda!" : "Status Pelerek dinonaktifkan");
      };

      // Simpan Warga di Database Induk (dengan Anak Asuh, Multi-Kendaraan & Sandi Terenkripsi)
      const handleSaveWarga = (e) => {
        e.preventDefault();
        if (!wargaForm.owner || !wargaForm.unit || !wargaForm.phone) {
          showToast("Mohon lengkapi Nama, Nomor Unit, dan WhatsApp!");
          return;
        }
        const parsedAnggota = wargaForm.anggotaKeluargaStr
          ? wargaForm.anggotaKeluargaStr.split(",").map((s) => s.trim()).filter(Boolean)
          : [wargaForm.owner, wargaForm.pasangan].filter((x) => x && x !== "-");

        const extraVehicles = wargaForm.extraVehiclesStr
          ? wargaForm.extraVehiclesStr.split(",").map((s) => s.trim()).filter(Boolean)
          : [];
        const allVehicles = [wargaForm.plat, ...extraVehicles].filter((x) => x && x !== "-");
        const combinedPlatString = allVehicles.join(", ") || "-";

        if (editingUnitId) {
          setUnitsData((prev) =>
            ensureMasterAdmin(
              prev.map((u) => {
                if (u.id !== editingUnitId) return u;
                const nextPassword = wargaForm.password
                  ? hashSecret(wargaForm.password)
                  : u.password;
                return {
                  ...u,
                  owner: wargaForm.owner,
                  pasangan: wargaForm.pasangan || "-",
                  anakCount: Number(wargaForm.anakCount || 0),
                  anakAsuhList: wargaForm.anakAsuhList || "-",
                  golDarah: wargaForm.golDarah,
                  anggotaKeluarga: parsedAnggota,
                  unit: wargaForm.unit,
                  blok: wargaForm.blok,
                  phone: u.isProtected ? MASTER_ADMIN.phone : wargaForm.phone,
                  password: u.isProtected ? MASTER_ADMIN.password : nextPassword,
                  nik: wargaForm.nik,
                  kk: wargaForm.kk,
                  role: u.isProtected ? "pengurus" : wargaForm.role,
                  statusHuni: wargaForm.statusHuni,
                  infoKontrak: wargaForm.infoKontrak,
                  pemilikAsli: wargaForm.pemilikAsli,
                  waPemilikAsli: wargaForm.waPemilikAsli,
                  mulaiKontrak: wargaForm.mulaiKontrak,
                  akhirKontrak: wargaForm.akhirKontrak,
                  penanggungJawabIPL: wargaForm.penanggungJawabIPL,
                  plat: combinedPlatString,
                  vehiclesList: allVehicles,
                  jadwalRondaPekan: wargaForm.jadwalRondaPekan || "Pekan Ke-1 (Sabtu Malam)",
                  iplComponents: {
                    keamanan: !!wargaForm.keamanan,
                    kebersihan: !!wargaForm.kebersihan,
                    kas: !!wargaForm.kas
                  }
                };
              })
            )
          );
          setEditingUnitId(null);
          triggerSuccessPopup("Data Warga Diperbarui", `Unit ${wargaForm.unit} (${wargaForm.owner}) tersimpan`);
        } else {
          const newUnit = {
            id: Date.now(),
            owner: wargaForm.owner,
            pasangan: wargaForm.pasangan || "-",
            anakCount: Number(wargaForm.anakCount || 0),
            anakAsuhList: wargaForm.anakAsuhList || "-",
            golDarah: wargaForm.golDarah || "O",
            anggotaKeluarga: parsedAnggota,
            unit: wargaForm.unit,
            blok: wargaForm.blok,
            phone: wargaForm.phone,
            password: hashSecret(wargaForm.password || "123456"),
            nik: wargaForm.nik || "-",
            kk: wargaForm.kk || "-",
            role: wargaForm.role || "warga",
            statusHuni: wargaForm.statusHuni,
            infoKontrak: wargaForm.infoKontrak || "-",
            pemilikAsli: wargaForm.pemilikAsli || wargaForm.owner,
            waPemilikAsli: wargaForm.waPemilikAsli || wargaForm.phone,
            mulaiKontrak: wargaForm.mulaiKontrak || "-",
            akhirKontrak: wargaForm.akhirKontrak || "-",
            penanggungJawabIPL: wargaForm.penanggungJawabIPL || "Penghuni / Penyewa",
            plat: combinedPlatString,
            vehiclesList: allVehicles,
            jadwalRondaPekan: wargaForm.jadwalRondaPekan || "Pekan Ke-1 (Sabtu Malam)",
            sediakanPelerek: false,
            ketPelerek: "",
            statusIuran: "Lunas",
            iplComponents: {
              keamanan: !!wargaForm.keamanan,
              kebersihan: !!wargaForm.kebersihan,
              kas: !!wargaForm.kas
            },
            months2025: buildDefaultMonthsMap("Belum Jatuh Tempo"),
            months2026: buildDefaultMonthsMap("Belum Jatuh Tempo"),
            months2027: buildDefaultMonthsMap("Belum Jatuh Tempo"),
            paymentMethods2025: buildDefaultMonthsMap("-"),
            paymentMethods2026: buildDefaultMonthsMap("-"),
            paymentMethods2027: buildDefaultMonthsMap("-"),
            paymentProofs2025: {},
            paymentProofs2026: {},
            paymentProofs2027: {},
            paidDates2025: {},
            paidDates2026: {},
            paidDates2027: {},
            isProtected: false,
            isHiddenSystem: false
          };
          setUnitsData((prev) => ensureMasterAdmin([...prev, newUnit]));
          triggerSuccessPopup("Warga & Akun Ditambahkan", `Unit ${newUnit.unit} (${newUnit.owner}) aktif`);
        }
        setWargaForm({
          owner: "", pasangan: "", anakCount: 0, anakAsuhList: "", golDarah: "O", anggotaKeluargaStr: "",
          unit: "", blok: "Blok A", phone: "", password: "", nik: "", kk: "", role: "warga",
          statusHuni: "Milik Sendiri (Dihuni)", infoKontrak: "", pemilikAsli: "", waPemilikAsli: "",
          mulaiKontrak: "", akhirKontrak: "", penanggungJawabIPL: "Penghuni / Penyewa",
          plat: "", extraVehiclesStr: "", jadwalRondaPekan: "Pekan Ke-1 (Sabtu Malam)",
          keamanan: true, kebersihan: true, kas: true
        });
      };

      // ================= 1. ANIMASI BOOTING / LOADING SCREEN =================
      if (isBooting) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-emerald-950 via-teal-950 to-slate-950 flex flex-col items-center justify-center p-6 text-white relative overflow-hidden">
            <div className="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-emerald-500/25 blur-3xl animate-aurora pointer-events-none"></div>
            <div className="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-amber-400/20 blur-3xl animate-aurora pointer-events-none"></div>
            <div className="relative flex items-center justify-center mb-5">
              <div className="w-24 h-24 rounded-full border-4 border-emerald-400/30 border-t-amber-400 animate-spin"></div>
              <div className="absolute inset-0 flex items-center justify-center">
                <GMMLogo customLogo={appConfig.customLogo} className="w-16 h-16 animate-float" />
              </div>
            </div>
            <h1 className="text-base sm:text-lg font-black tracking-tight text-center text-amber-300 animate-fadeIn">
              {appConfig.namaPerumahan}
            </h1>
            <p className="text-xs text-emerald-200/80 font-semibold mt-1 animate-pulse">
              Menyiapkan Portal Digital & Sinkronisasi Cloud...
            </p>
          </div>
        );
      }

      // ================= 2. HALAMAN LOGIN SEDERHANA & SANDI TERENKRIPSI =================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-emerald-950 via-teal-950 to-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
            <div className="absolute -top-28 -left-28 w-80 h-80 rounded-full bg-emerald-500/25 blur-3xl pointer-events-none animate-aurora"></div>
            <div className="absolute -bottom-28 -right-28 w-80 h-80 rounded-full bg-amber-400/20 blur-3xl pointer-events-none animate-aurora"></div>

            <div className="max-w-sm w-full bg-white/95 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/60 overflow-hidden relative z-10 animate-popup">
              <div className="bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 p-6 text-center text-white relative overflow-hidden">
                <div className="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-amber-400/15 blur-2xl pointer-events-none"></div>
                <GMMLogo customLogo={appConfig.customLogo} className="w-20 h-20 mx-auto mb-3 animate-float" />
                <h1 className="text-base sm:text-lg font-black tracking-tight leading-snug">
                  {appConfig.namaPerumahan}
                </h1>
                <p className="text-[11px] text-emerald-200 font-semibold mt-0.5">
                  Portal Digital Warga Terpadu • Enkripsi SHA-256 Aktif
                </p>
              </div>

              <form onSubmit={handleLogin} className="p-6 space-y-4">
                {loginError && (
                  <div className="p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold flex items-center gap-2 animate-fadeIn">
                    <span>⚠️</span>
                    <span>{loginError}</span>
                  </div>
                )}

                <div className="space-y-1">
                  <label className="block text-xs font-extrabold text-slate-700">
                    Nomor WhatsApp Terdaftar
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="08xxxxxxxxxx"
                    value={loginPhone}
                    onChange={(e) => setLoginPhone(e.target.value)}
                    className="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/15 outline-none text-sm font-bold bg-slate-50 transition-all"
                  />
                </div>

                <div className="space-y-1">
                  <label className="block text-xs font-extrabold text-slate-700">
                    Kata Sandi (Terenkripsi)
                  </label>
                  <div className="relative">
                    <input
                      type={showPassword ? "text" : "password"}
                      required
                      placeholder="••••••"
                      value={loginPass}
                      onChange={(e) => setLoginPass(e.target.value)}
                      className="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-500/15 outline-none text-sm font-bold bg-slate-50 pr-16 transition-all"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 px-2.5 py-1 rounded-lg bg-slate-200/80 text-[10px] font-black text-slate-700"
                    >
                      {showPassword ? "TUTUP" : "LIHAT"}
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-800 to-teal-800 hover:from-emerald-900 hover:to-teal-900 text-white font-black text-sm shadow-lg transition cursor-pointer btn-press btn-shine-effect"
                >
                  🔒 Masuk Portal
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ================= 3. DASHBOARD UTAMA APLIKASI =================
      return (
        <div className="min-h-screen flex flex-col bg-slate-100 text-slate-900 pb-12">
          {/* POP-UP MODAL BERHASIL DENGAN ANIMASI PULSE & BOUNCE */}
          {successPopup && (
            <div
              onClick={() => setSuccessPopup(null)}
              className="fixed inset-0 z-[90] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-2 border-emerald-200 animate-popup relative overflow-hidden"
              >
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-3xl mx-auto mb-3 animate-emerald-pulse">
                  ✅
                </div>
                <h3 className="text-base font-black text-slate-900">{successPopup.title}</h3>
                <p className="text-xs text-slate-600 mt-1 font-semibold">{successPopup.subtitle}</p>
                <button
                  onClick={() => setSuccessPopup(null)}
                  className="mt-4 w-full py-2 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-black btn-press btn-shine-effect"
                >
                  ✨ Oke, Mengerti
                </button>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION MELAYANG */}

                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-bold mb-1">Tanggal Pinjam</label>
                        <input
                          type="date"
                          value={formInventaris.tglPinjam}
                          onChange={(e) => setFormInventaris({ ...formInventaris, tglPinjam: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        />
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Estimasi Kembali</label>
                        <input
                          type="date"
                          value={formInventaris.tglKembali}
                          onChange={(e) => setFormInventaris({ ...formInventaris, tglKembali: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        />
                      </div>
                    </div>
                    <input
                      type="text"
                      placeholder="Keperluan Acara / Peminjaman"
                      value={formInventaris.keperluan}
                      onChange={(e) => setFormInventaris({ ...formInventaris, keperluan: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <div>
                      <label className="block font-bold mb-1">📷 Foto Kondisi Barang</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={(e) => compressImageFile(e.target.files?.[0], (b64) => setFormInventaris({ ...formInventaris, foto: b64 }))}
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-purple-700 text-white font-black">
                      Ajukan Peminjaman Inventaris
                    </button>
                  </form>
                )}

                {/* MODAL E-SURAT JALAN */}
                {activeModal === "surat" && (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const uObj = visibleUnitsData.find((u) => u.unit === formSurat.unit) || currentUser;
                      const newSrt = {
                        id: "srt-" + Date.now(),
                        nomorSurat: `SJ/GMM/2026/${100 + suratList.length + 1}`,
                        tanggalISO: getLocalTodayISO(),
                        namaWarga: uObj.owner,
                        unit: uObj.unit,
                        jenisSurat: formSurat.jenisSurat,
                        kendaraan: formSurat.kendaraan,
                        ket: formSurat.ket,
                        status: "Disetujui Pos 1",
                        foto: formSurat.foto
                      };
                      setSuratList((prev) => [newSrt, ...prev]);
                      setActiveModal(null);
                      triggerSuccessPopup("E-Surat Jalan Terbit", `Nomor: ${newSrt.nomorSurat}`);
                    }}
                    className="space-y-3 text-xs"
                  >
                    <select
                      value={formSurat.unit}
                      onChange={(e) => setFormSurat({ ...formSurat, unit: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      {visibleUnitsData.map((u) => <option key={u.id} value={u.unit}>{u.unit} — {u.owner}</option>)}
                    </select>
                    <select
                      value={formSurat.jenisSurat}
                      onChange={(e) => setFormSurat({ ...formSurat, jenisSurat: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      <option>Keluar Masuk Barang / Pindahan</option>
                      <option>Izin Material Renovasi Rumah</option>
                      <option>Pengiriman Furniture / Elektronik</option>
                    </select>
                    <input
                      type="text"
                      placeholder="Jenis Kendaraan Pengangkut"
                      value={formSurat.kendaraan}
                      onChange={(e) => setFormSurat({ ...formSurat, kendaraan: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <input
                      type="text"
                      required
                      placeholder="Keterangan Barang / Renovasi"
                      value={formSurat.ket}
                      onChange={(e) => setFormSurat({ ...formSurat, ket: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <div>
                      <label className="block font-bold mb-1">📷 Upload Foto Barang / Kendaraan</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={(e) => compressImageFile(e.target.files?.[0], (b64) => setFormSurat({ ...formSurat, foto: b64 }))}
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-rose-700 text-white font-black">
                      Terbitkan E-Surat Jalan
                    </button>
                  </form>
                )}

                {/* MODAL JADWAL SAMPAH */}
                {activeModal === "sampah" && (
                  <div className="space-y-3 text-xs">
                    {JADWAL_SAMPAH_DEFAULT.map((js, i) => (
                      <div key={i} className="p-3.5 rounded-2xl bg-lime-50 border border-lime-200 space-y-1">
                        <div className="flex items-center justify-between font-black text-lime-950">
                          <span>🗓️ {js.hari}</span>
                          <span>{js.jam}</span>
                        </div>
                        <div className="font-bold text-slate-800">Area: {js.area} ({js.petugas})</div>
                        <div className="text-slate-600">{js.catatan}</div>
                      </div>
                    ))}
                  </div>
                )}

                {/* MODAL JASA TUKANG LANGGANAN */}
                {activeModal === "tukang" && (
                  <div className="space-y-3 text-xs">
                    {JASA_TUKANG_DEFAULT.map((tk) => (
                      <div key={tk.id} className="p-3.5 rounded-2xl bg-orange-50 border border-orange-200 flex items-center justify-between gap-2">
                        <div>
                          <div className="font-black text-slate-900">{tk.nama}</div>
                          <div className="font-bold text-orange-900">{tk.keahlian}</div>
                          <div className="text-[11px] text-slate-600">Estimasi: {tk.tarif} • {tk.status}</div>
                        </div>
                        <a
                          href={`https://wa.me/62${String(tk.wa).replace(/^0/, "")}`}
                          target="_blank"
                          rel="noreferrer"
                          className="px-3 py-2 rounded-xl bg-emerald-700 text-white font-black shrink-0"
                        >
                          💬 Panggil WA
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL E-KWITANSI RESMI */}
          {kwitansiData && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-emerald-200 animate-popup space-y-4">
                <div id="printable-area" className="space-y-3">
                  <div className="flex items-center gap-3 pb-3 border-b border-slate-200">
                    <GMMLogo customLogo={appConfig.customLogo} className="w-12 h-12" />
                    <div>
                      <div className="text-xs font-black text-emerald-900">{appConfig.namaPerumahan}</div>
                      <div className="text-[10px] text-slate-500">E-Kwitansi Resmi Pembayaran IPL Warga</div>
                    </div>
                  </div>
                  <div className="text-xs space-y-1.5">
                    <div className="flex justify-between"><span>No. Referensi:</span><strong>{kwitansiData.noRef}</strong></div>
                    <div className="flex justify-between"><span>Unit / Warga:</span><strong>{kwitansiData.unit} — {kwitansiData.owner}</strong></div>
                    <div className="flex justify-between"><span>Status Hunian:</span><strong>{kwitansiData.statusHuni} ({kwitansiData.penanggungJawab})</strong></div>
                    <div className="flex justify-between"><span>Periode IPL:</span><strong>{kwitansiData.bulan} {kwitansiData.tahun}</strong></div>
                    <div className="flex justify-between"><span>Metode Bayar:</span><strong>{kwitansiData.metode}</strong></div>
                    <div className="flex justify-between"><span>Tanggal Lunas:</span><strong>{kwitansiData.tanggal}</strong></div>
                    <div className="flex justify-between text-sm pt-2 border-t border-slate-200">
                      <span className="font-bold">Total Diterima:</span>
                      <strong className="text-emerald-800 font-black">{formatRupiah(kwitansiData.nominal)} (LUNAS)</strong>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2 pt-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-black"
                  >
                    🖨️ Cetak / Simpan PDF Kwitansi
                  </button>
                  <button
                    onClick={() => setKwitansiData(null)}
                    className="px-4 py-2.5 rounded-xl bg-slate-200 text-slate-800 text-xs font-black"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
