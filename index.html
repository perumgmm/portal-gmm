  <!-- MODUL ENKRIPSI KRIPTOGRAFI END-TO-END (AES-256-GCM + PBKDF2 + SHA-256) -->
  <script>
    window.GMM_CRYPTO = {
      algorithm: 'AES-256-GCM (PBKDF2 100.000 Iterasi + SHA-256 Integrity)',
      defaultSecret: 'GMM-MEKARWANGI-2026-VAULT-KEY-9981',

      getSecretKeyString() {
        return window.__gmm_custom_vault_key || this.defaultSecret;
      },

      setSecretKeyString(newKey) {
        if (newKey && newKey.trim().length >= 6) {
          window.__gmm_custom_vault_key = newKey.trim();
          return true;
        }
        return false;
      },

      async deriveKey(passphrase, saltBytes) {
        const enc = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          'raw',
          enc.encode(passphrase),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );
        return window.crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: saltBytes,
            iterations: 100000,
            hash: 'SHA-256'
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      },

      bytesToBase64(bytes) {
        let binary = '';
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      },

      base64ToBytes(base64) {
        const binary = atob(base64);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      },

      async sha256Hex(message) {
        const enc = new TextEncoder();
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', enc.encode(message));
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
      },

      async encryptText(plainText) {
        if (typeof plainText !== 'string') plainText = JSON.stringify(plainText);
        const enc = new TextEncoder();
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(this.getSecretKeyString(), salt);
        const encryptedBuf = await window.crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          enc.encode(plainText)
        );
        return `GMM_ENC_V1:${this.bytesToBase64(salt)}:${this.bytesToBase64(iv)}:${this.bytesToBase64(new Uint8Array(encryptedBuf))}`;
      },

      async decryptText(cipherPayload) {
        if (!cipherPayload || typeof cipherPayload !== 'string') return cipherPayload;
        if (!cipherPayload.startsWith('GMM_ENC_V1:')) return cipherPayload;
        const parts = cipherPayload.split(':');
        if (parts.length !== 4) throw new Error('Format enkripsi tidak valid.');
        const salt = this.base64ToBytes(parts[1]);
        const iv = this.base64ToBytes(parts[2]);
        const cipherBytes = this.base64ToBytes(parts[3]);
        const key = await this.deriveKey(this.getSecretKeyString(), salt);
        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          cipherBytes
        );
        const dec = new TextDecoder();
        return dec.decode(decryptedBuf);
      },

      async encryptPayloadMap(payloadObj) {
        const encryptedMap = {};
        let combinedPlain = '';
        for (const [k, v] of Object.entries(payloadObj)) {
          if (typeof v === 'string') {
            combinedPlain += v;
            encryptedMap[k] = await this.encryptText(v);
          } else {
            encryptedMap[k] = v;
          }
        }
        encryptedMap.__encryptionVersion = 'AES-256-GCM-PBKDF2-V1';
        encryptedMap.__integrityHash = await this.sha256Hex(combinedPlain);
        return encryptedMap;
      },

      async decryptPayloadMap(encryptedObj) {
        if (!encryptedObj) return null;
        const decryptedMap = {};
        for (const [k, v] of Object.entries(encryptedObj)) {
          if (typeof v === 'string' && v.startsWith('GMM_ENC_V1:')) {
            decryptedMap[k] = await this.decryptText(v);
          } else {
            decryptedMap[k] = v;
          }
        }
        return decryptedMap;
      }
    };
  </script>

  <!-- MODUL CLOUD DATABASE (FIRESTORE) OTOMATIS & REAL-TIME TERENKRIPSI + SUPPORT CUSTOM FIREBASE MILIK SENDIRI -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAnalytics, isSupported as isAnalyticsSupported } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { initializeFirestore, doc, setDoc, getDoc, onSnapshot, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Redam pesan peringatan streaming internal Firestore agar tidak memicu error console di iframe
    try {
      setLogLevel('error');
    } catch (_) {}

    // ============================================================================
    // PENGATURAN FIREBASE PERMANEN: grande-mulia-mekarwangi
    // ============================================================================
    window.CUSTOM_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBvVyjk9Vo9vHUaUBpd52y4-jnotH1_28o",
      authDomain: "grande-mulia-mekarwangi.firebaseapp.com",
      projectId: "grande-mulia-mekarwangi",
      storageBucket: "grande-mulia-mekarwangi.firebasestorage.app",
      messagingSenderId: "358648133384",
      appId: "1:358648133384:web:afa4927aaab89894f75ebd",
      measurementId: "G-TZ6KW7S1TD"
    };

    window.GMM_CLOUD = {
      ready: false,
      uid: null,
      mode: 'Firebase Permanen (grande-mulia-mekarwangi)',
      activeProjectId: 'grande-mulia-mekarwangi',
      status: 'Menghubungkan ke grande-mulia-mekarwangi...',
      lastCipherPreview: '',
      lastIntegrityHash: '',
      saveState: async () => false,
      loadInitial: async () => null,
      subscribe: () => () => {},
      connectCustomFirebase: async () => false
    };

    // Helper timeout untuk mencegah getDoc / Firestore menggantung lebih dari 3.5 detik
    const withTimeout = (promise, ms = 3500) => {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT_FIRESTORE')), ms))
      ]);
    };

    const LOCAL_FALLBACK_KEY = 'gmm_master_state_offline_vault';

    const bindCloudInstance = (firebaseConfig, customAppName, isCustomUserConfig = false) => {
      try {
        const appId = typeof __app_id !== 'undefined' && !isCustomUserConfig ? __app_id : (firebaseConfig.projectId || 'grande-mulia-mekarwangi');
        const existingApp = getApps().find((a) => a.name === customAppName);
        const app = existingApp || initializeApp(firebaseConfig, customAppName);

        if (firebaseConfig.measurementId) {
          isAnalyticsSupported()
            .then((yes) => {
              if (yes) getAnalytics(app);
            })
            .catch(() => {});
        }

        const auth = getAuth(app);

        // INISIALISASI FIRESTORE DENGAN LONG-POLLING TANPA FETCH STREAMS
        // autoDetectLongPolling: false mencegah Firestore menunggu 10 detik sebelum beralih ke Long-Polling
        const db = initializeFirestore(app, {
          experimentalForceLongPolling: true,
          experimentalAutoDetectLongPolling: false,
          useFetchStreams: false
        });

        window.GMM_CLOUD.mode = isCustomUserConfig ? 'Firebase Permanen (grande-mulia-mekarwangi)' : 'Cloud Environment';
        window.GMM_CLOUD.activeProjectId = firebaseConfig.projectId || appId;
        const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'gmm_master_state', 'v3_production');

        const activateCloudCallbacks = (uidLabel) => {
          window.GMM_CLOUD.ready = true;
          window.GMM_CLOUD.uid = uidLabel;
          window.GMM_CLOUD.status = `Terhubung ke ${firebaseConfig.projectId || 'grande-mulia-mekarwangi'} (AES-256 Long-Polling)`;

          window.GMM_CLOUD.loadInitial = async () => {
            try {
              // Coba muat dari Cloud dengan batas waktu cepat (3.5 detik)
              const snap = await withTimeout(getDoc(stateDocRef), 3500);
              if (!snap.exists()) {
                const localSaved = localStorage.getItem(LOCAL_FALLBACK_KEY);
                if (localSaved) {
                  return await window.GMM_CRYPTO.decryptPayloadMap(JSON.parse(localSaved));
                }
                return null;
              }
              const rawDoc = snap.data();
              if (rawDoc.unitsData && typeof rawDoc.unitsData === 'string' && rawDoc.unitsData.startsWith('GMM_ENC_V1:')) {
                window.GMM_CLOUD.lastCipherPreview = rawDoc.unitsData.slice(0, 78) + '...';
              }
              if (rawDoc.__integrityHash) {
                window.GMM_CLOUD.lastIntegrityHash = rawDoc.__integrityHash;
              }
              localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(rawDoc));
              return await window.GMM_CRYPTO.decryptPayloadMap(rawDoc);
            } catch (e) {
              window.GMM_CLOUD.status = `Mode Siaga Offline • ${firebaseConfig.projectId || 'grande-mulia-mekarwangi'}`;
              try {
                const localSaved = localStorage.getItem(LOCAL_FALLBACK_KEY);
                if (localSaved) {
                  const cachedDoc = JSON.parse(localSaved);
                  return await window.GMM_CRYPTO.decryptPayloadMap(cachedDoc);
                }
              } catch (_) {}
              return null;
            }
          };

          window.GMM_CLOUD.saveState = async (payload, clientSyncId) => {
            try {
              const encryptedPayload = await window.GMM_CRYPTO.encryptPayloadMap(payload);
              window.GMM_CLOUD.lastCipherPreview = (encryptedPayload.unitsData || '').slice(0, 78) + '...';
              window.GMM_CLOUD.lastIntegrityHash = encryptedPayload.__integrityHash || '';

              const fullDoc = {
                ...encryptedPayload,
                clientSyncId: clientSyncId || '',
                updatedAt: new Date().toISOString(),
                updatedBy: auth.currentUser?.uid || uidLabel
              };

              // Simpan ke localStorage sebagai cadangan instan
              try {
                localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(fullDoc));
              } catch (_) {}

              // Simpan ke Firestore dengan batas timeout cepat
              await withTimeout(setDoc(stateDocRef, fullDoc, { merge: true }), 4000);
              return true;
            } catch (e) {
              return true; // Tetap sukses di mode offline lokal
            }
          };

          window.GMM_CLOUD.subscribe = (onDataCallback, onErrorCallback) => {
            try {
              return onSnapshot(
                stateDocRef,
                async (snap) => {
                  if (snap.exists()) {
                    try {
                      const rawDoc = snap.data();
                      if (rawDoc.unitsData && typeof rawDoc.unitsData === 'string' && rawDoc.unitsData.startsWith('GMM_ENC_V1:')) {
                        window.GMM_CLOUD.lastCipherPreview = rawDoc.unitsData.slice(0, 78) + '...';
                      }
                      if (rawDoc.__integrityHash) {
                        window.GMM_CLOUD.lastIntegrityHash = rawDoc.__integrityHash;
                      }
                      localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(rawDoc));
                      const decrypted = await window.GMM_CRYPTO.decryptPayloadMap(rawDoc);
                      onDataCallback(decrypted);
                    } catch (_) {}
                  }
                },
                (err) => {
                  if (onErrorCallback) onErrorCallback(err);
                }
              );
            } catch (subErr) {
              return () => {};
            }
          };

          window.dispatchEvent(new CustomEvent('gmm-cloud-ready'));
        };

        const initAuth = async () => {
          try {
            if (!isCustomUserConfig && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            activateCloudCallbacks('direct_session_' + (firebaseConfig.projectId || 'gmm'));
          }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
          if (user) {
            activateCloudCallbacks(user.uid);
          }
        });
        return true;
      } catch (err) {
        return false;
      }
    };

    window.GMM_CLOUD.connectCustomFirebase = async (rawConfigInput) => {
      try {
        let parsedConfig = rawConfigInput;
        if (typeof rawConfigInput === 'string') {
          let cleaned = rawConfigInput.trim();
          const firstBrace = cleaned.indexOf('{');
          const lastBrace = cleaned.lastIndexOf('}');
          if (firstBrace !== -1 && lastBrace !== -1) {
            cleaned = cleaned.slice(firstBrace, lastBrace + 1);
          }
          cleaned = cleaned.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
          cleaned = cleaned.replace(/,\s*}/g, '}');
          parsedConfig = JSON.parse(cleaned);
        }
        if (!parsedConfig || !parsedConfig.apiKey || !parsedConfig.projectId) {
          throw new Error('apiKey dan projectId wajib ada di dalam konfigurasi Firebase.');
        }
        const appName = 'gmm_custom_' + parsedConfig.projectId + '_' + Date.now();
        return bindCloudInstance(parsedConfig, appName, true);
      } catch (e) {
        console.error("Format konfigurasi Firebase tidak valid:", e);
        return false;
      }
    };

    try {
      const hasHardcodedCustom =
        window.CUSTOM_FIREBASE_CONFIG &&
        window.CUSTOM_FIREBASE_CONFIG.apiKey &&
        window.CUSTOM_FIREBASE_CONFIG.projectId;

      if (hasHardcodedCustom) {
        bindCloudInstance(window.CUSTOM_FIREBASE_CONFIG, 'gmm_hardcoded_custom', true);
      } else if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        const envConfig = JSON.parse(__firebase_config);
        bindCloudInstance(envConfig, 'gmm_default_env', false);
      } else {
        window.GMM_CLOUD.status = 'Siap Koneksi Firebase Kustom (Buka Panel Admin → Enkripsi & Cloud DB)';
      }
    } catch (e) {
      console.warn("Mode Cloud Standby:", e);
    }
  </script>

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;

        document.body.appendChild(a);

                              ...newAccountForm,
                              isProtected: false,
                              keteranganAkun: `Akun ${newAccountForm.role.toUpperCase()} (${newAccountForm.unit})`
                            };
                            setAccounts([...accounts, newAcc]);
                            setNewAccountForm({
                              name: '',
                              wa: '',
                              password: '123',
                              unit: '',
                              blok: 'Blok A',
                              nik: '',
                              role: 'warga',
                              statusHuni: 'Milik Sendiri (Dihuni)'
                            });
                            showToast(`✅ Akun login untuk ${newAcc.name} berhasil ditambahkan!`);
                          }}
                          className="p-3.5 rounded-2xl bg-emerald-50/70 border border-emerald-200 space-y-2.5"
                        >
                          <div className="font-extrabold text-emerald-950">+ Tambah Akun Login Baru (Warga, Security, atau DKM)</div>
                          <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                            <input
                              type="text"
                              required
                              placeholder="Nama Pemilik Akun..."
                              value={newAccountForm.name}
                              onChange={(e) => setNewAccountForm({ ...newAccountForm, name: e.target.value })}
                              className="px-3 py-2 rounded-xl border border-slate-300 bg-white font-bold"
                            />
                            <input
                              type="text"
                              required
                              placeholder="Nomor WhatsApp..."
                              value={newAccountForm.wa}
                              onChange={(e) => setNewAccountForm({ ...newAccountForm, wa: e.target.value })}
                              className="px-3 py-2 rounded-xl border border-slate-300 bg-white font-mono font-bold"
                            />
                            <input
                              type="text"
                              required
                              placeholder="Password Login..."
                              value={newAccountForm.password}
                              onChange={(e) => setNewAccountForm({ ...newAccountForm, password: e.target.value })}
                              className="px-3 py-2 rounded-xl border border-slate-300 bg-white font-mono font-bold"
                            />
                            <select
                              value={newAccountForm.role}
                              onChange={(e) => setNewAccountForm({ ...newAccountForm, role: e.target.value })}
                              className="px-3 py-2 rounded-xl border border-slate-300 bg-white font-bold"
                            >
                              <option value="warga">👤 Role: Warga</option>
                              <option value="security">👮 Role: Security Pos 1–3</option>
                              <option value="dkm">🕌 Role: Pengurus DKM</option>
                              <option value="pengurus">🛡️ Role: Super Admin</option>
                            </select>
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <input
                              type="text"
                              required
                              placeholder="Unit Rumah / Pos (Cth: BLOK A - No. 01)"
                              value={newAccountForm.unit}
                              onChange={(e) => setNewAccountForm({ ...newAccountForm, unit: e.target.value })}
                              className="px-3 py-2 rounded-xl border border-slate-300 bg-white"
                            />
                            <select
                              value={newAccountForm.blok}
                              onChange={(e) => setNewAccountForm({ ...newAccountForm, blok: e.target.value })}
                              className="px-3 py-2 rounded-xl border border-slate-300 bg-white font-bold"
                            >
                              {['Blok A', 'Blok B', 'Blok C', 'Blok D', 'Blok E', 'Blok F', 'Pusat'].map((b) => (
                                <option key={b}>{b}</option>
                              ))}
                            </select>
                            <button type="submit" className="py-2 px-4 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold shadow-sm">
                              + Simpan Akun Baru
                            </button>
                          </div>
                        </form>

                        {/* TABEL DATA INDUK AKUN LOGIN */}
                        <div className="overflow-x-auto">
                          <table className="w-full text-left border-collapse text-xs">
                            <thead>
                              <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                                <th className="p-2.5 font-extrabold">Nama & Unit</th>
                                <th className="p-2.5 font-extrabold">Role Akses</th>
                                <th className="p-2.5 font-extrabold">Nomor WhatsApp</th>
                                <th className="p-2.5 font-extrabold">Password Login</th>
                                <th className="p-2.5 font-extrabold text-right">Aksi</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                              {accounts.map((acc) => {
                                const isMasterAdmin = acc.isProtected || (acc.wa && acc.wa.replace(/[^0-9]/g, '') === MASTER_ADMIN_WA.replace(/[^0-9]/g, ''));
                                return (
                                  <tr key={acc.id} className={isMasterAdmin ? 'bg-amber-50/60 font-bold' : 'hover:bg-slate-50'}>
                                    <td className="p-2.5">
                                      <div className="flex items-center gap-1.5">
                                        <span className="font-extrabold text-slate-900">{acc.name}</span>
                                        {isMasterAdmin && (
                                          <span className="px-1.5 py-0.2 rounded bg-amber-400 text-slate-950 text-[9px] font-extrabold">
                                            MUTLAK
                                          </span>
                                        )}
                                      </div>
                                      <div className="text-[11px] text-emerald-800">{acc.unit}</div>
                                    </td>
                                    <td className="p-2.5">
                                      {isMasterAdmin ? (
                                        <span className="px-2 py-0.5 rounded bg-amber-600 text-white text-[10px] font-extrabold">
                                          SUPER ADMIN (LOCKED)
                                        </span>
                                      ) : (
                                        <select
                                          value={acc.role}
                                          onChange={(e) => {
                                            const newRole = e.target.value;
                                            setAccounts((prev) => prev.map((it) => (it.id === acc.id ? { ...it, role: newRole } : it)));
                                            showToast(`Role akun ${acc.name} diubah!`);
                                          }}
                                          className="px-2.5 py-1 rounded-lg border border-slate-300 font-extrabold text-[11px] bg-white"
                                        >
                                          <option value="warga">👤 Warga</option>
                                          <option value="security">👮 Security</option>
                                          <option value="dkm">🕌 DKM Mushola</option>
                                          <option value="pengurus">🛡️ Super Admin</option>
                                        </select>
                                      )}
                                    </td>
                                    <td className="p-2.5 font-mono font-extrabold">
                                      {acc.wa}
                                    </td>
                                    <td className="p-2.5 font-mono">
                                      <span className="px-2 py-1 rounded bg-slate-100 font-bold">
                                        {showAllPasswordsAdmin ? acc.password : '••••••'}
                                      </span>
                                    </td>
                                    <td className="p-2.5 text-right space-x-1 whitespace-nowrap">
                                      {isMasterAdmin ? (
                                        <span className="text-[10px] text-amber-800 font-extrabold italic">
                                          🔒 Akun Utama Mutlak
                                        </span>
                                      ) : (
                                        <button
                                          type="button"
                                          onClick={() => {
                                            setAccounts((prev) => prev.filter((it) => it.id !== acc.id));
                                            showToast(`Akun ${acc.name} berhasil dihapus.`);
                                          }}
                                          className="px-2 py-1 rounded-lg bg-rose-100 text-rose-700 font-bold text-[10px]"
                                        >
                                          🗑️ Hapus
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* SUBTAB 4: PENGATURAN */}
                    {adminSubTab === 'pengaturan' && (
                      <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3 text-xs">
                        <h3 className="font-extrabold text-sm text-slate-900">⚙️ Pengaturan Sistem & Rekening Pembayaran</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          <div>
                            <label className="block font-bold mb-1">Nama Perumahan</label>
                            <input
                              type="text"
                              value={appConfig.namaPerumahan}
                              onChange={(e) => setAppConfig({ ...appConfig, namaPerumahan: e.target.value })}
                              className="w-full px-3 py-2 rounded-xl border border-slate-300"
                            />
                          </div>
                          <div>
                            <label className="block font-bold mb-1">Sub-Judul Pengelola</label>
                            <input
                              type="text"
                              value={appConfig.pengelola}
                              onChange={(e) => setAppConfig({ ...appConfig, pengelola: e.target.value })}
                              className="w-full px-3 py-2 rounded-xl border border-slate-300"
                            />
                          </div>
                        </div>
                        <button
                          onClick={() => {
                            handleSyncToCloudDatabase(true);
                            showToast('Pengaturan berhasil disimpan!');
                          }}
                          className="px-4 py-2 rounded-xl bg-emerald-800 text-white font-extrabold"
                        >
                          Simpan Pengaturan
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}

            <footer className="pt-6 pb-4 text-center text-xs text-slate-500 space-y-1">
              <div className="font-extrabold text-slate-700">copyright 2026 aufah tech allright reserved.</div>
              <div>{appConfig.namaPerumahan} — {appConfig.pengelola}</div>
            </footer>
          </main>

          {/* MODAL SOS */}
          {activeModal === 'sos' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-rose-700">🚨 Sirine Darurat SOS ke Pos Keamanan</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                {['Bahaya Keamanan / Tamu Mencurigakan', 'Darurat Medis / Ambulans', 'Bahaya Kebakaran'].map((j) => (
                  <button
                    key={j}
                    onClick={() => {
                      setActiveModal(null);
                      showToast(`SINYAL SOS (${j}) DIKIRIM KE POS SECURITY!`);
                    }}
                    className="w-full p-3 rounded-2xl bg-rose-50 hover:bg-rose-100 border border-rose-200 font-extrabold text-rose-900 text-left"
                  >
                    🚨 {j}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-3 inset-x-3 z-30 max-w-4xl mx-auto bg-white/95 backdrop-blur-2xl border border-slate-200/90 rounded-3xl px-2 py-2 shadow-2xl">
            <div className="grid grid-cols-6 gap-1">
              {navTabs.map((item) => {
                const isActive = activeTab === item.id;
                const isAllowed = ROLE_DEFINITIONS[viewMode]?.allowedTabs.includes(item.id);
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`relative flex flex-col items-center justify-center py-1.5 rounded-2xl transition ${
                      isActive ? 'bg-emerald-900 text-white shadow' : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span className="text-base leading-none">{isAllowed ? item.icon : '🔒'}</span>
                    <span className="text-[10px] font-extrabold mt-1 truncate max-w-full px-1">{item.label}</span>
                    {item.badge !== null && item.badge > 0 && isAllowed && (
                      <span className="absolute top-1 right-2 px-1.5 py-0.2 rounded-full bg-amber-400 text-slate-950 text-[9px] font-extrabold">
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
