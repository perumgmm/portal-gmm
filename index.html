  <!-- MODUL ENKRIPSI KRIPTOGRAFI END-TO-END (AES-256-GCM + PBKDF2 + SHA-256) -->
  <script>
    window.GMM_CRYPTO = {
      algorithm: 'AES-256-GCM (PBKDF2 100.000 Iterasi + SHA-256 Integrity)',
      defaultSecret: 'GMM-MEKARWANGI-2026-VAULT-KEY-9981',

      getSecretKeyString() {
        return window.__gmm_custom_vault_key || this.defaultSecret;
      },

      setSecretKeyString(newKey) {
        if (newKey && newKey.trim().length >= 6) {
          window.__gmm_custom_vault_key = newKey.trim();
          return true;
        }
        return false;
      },

      async deriveKey(passphrase, saltBytes) {
        const enc = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          'raw',
          enc.encode(passphrase),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );
        return window.crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: saltBytes,
            iterations: 100000,
            hash: 'SHA-256'
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      },

      bytesToBase64(bytes) {
        let binary = '';
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      },

      base64ToBytes(base64) {
        const binary = atob(base64);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      },

      async sha256Hex(message) {
        const enc = new TextEncoder();
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', enc.encode(message));
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
      },

      async encryptText(plainText) {
        if (typeof plainText !== 'string') plainText = JSON.stringify(plainText);
        const enc = new TextEncoder();
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(this.getSecretKeyString(), salt);
        const encryptedBuf = await window.crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          enc.encode(plainText)
        );
        return `GMM_ENC_V1:${this.bytesToBase64(salt)}:${this.bytesToBase64(iv)}:${this.bytesToBase64(new Uint8Array(encryptedBuf))}`;
      },

      async decryptText(cipherPayload) {
        if (!cipherPayload || typeof cipherPayload !== 'string') return cipherPayload;
        if (!cipherPayload.startsWith('GMM_ENC_V1:')) return cipherPayload;
        const parts = cipherPayload.split(':');
        if (parts.length !== 4) throw new Error('Format enkripsi tidak valid.');
        const salt = this.base64ToBytes(parts[1]);
        const iv = this.base64ToBytes(parts[2]);
        const cipherBytes = this.base64ToBytes(parts[3]);
        const key = await this.deriveKey(this.getSecretKeyString(), salt);
        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          cipherBytes
        );
        const dec = new TextDecoder();
        return dec.decode(decryptedBuf);
      },

      async encryptPayloadMap(payloadObj) {
        const encryptedMap = {};
        let combinedPlain = '';
        for (const [k, v] of Object.entries(payloadObj)) {
          if (typeof v === 'string') {
            combinedPlain += v;
            encryptedMap[k] = await this.encryptText(v);
          } else {
            encryptedMap[k] = v;
          }
        }
        encryptedMap.__encryptionVersion = 'AES-256-GCM-PBKDF2-V1';
        encryptedMap.__integrityHash = await this.sha256Hex(combinedPlain);
        return encryptedMap;
      },

      async decryptPayloadMap(encryptedObj) {
        if (!encryptedObj) return null;
        const decryptedMap = {};
        for (const [k, v] of Object.entries(encryptedObj)) {
          if (typeof v === 'string' && v.startsWith('GMM_ENC_V1:')) {
            decryptedMap[k] = await this.decryptText(v);
          } else {
            decryptedMap[k] = v;
          }
        }
        return decryptedMap;
      }
    };
  </script>

  <!-- MODUL CLOUD DATABASE (FIRESTORE) OTOMATIS & REAL-TIME TERENKRIPSI + SUPPORT CUSTOM FIREBASE MILIK SENDIRI -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAnalytics, isSupported as isAnalyticsSupported } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ============================================================================
    // PENGATURAN FIREBASE PERMANEN: grande-mulia-mekarwangi
    // ============================================================================
    window.CUSTOM_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBvVyjk9Vo9vHUaUBpd52y4-jnotH1_28o",
      authDomain: "grande-mulia-mekarwangi.firebaseapp.com",
      projectId: "grande-mulia-mekarwangi",
      storageBucket: "grande-mulia-mekarwangi.firebasestorage.app",
      messagingSenderId: "358648133384",
      appId: "1:358648133384:web:afa4927aaab89894f75ebd",
      measurementId: "G-TZ6KW7S1TD"
    };

    window.GMM_CLOUD = {
      ready: false,
      uid: null,
      mode: 'Firebase Permanen (grande-mulia-mekarwangi)',
      activeProjectId: 'grande-mulia-mekarwangi',
      status: 'Menghubungkan ke grande-mulia-mekarwangi...',
      lastCipherPreview: '',
      lastIntegrityHash: '',
      saveState: async () => false,
      loadInitial: async () => null,
      subscribe: () => () => {},
      connectCustomFirebase: async () => false
    };

    const bindCloudInstance = (firebaseConfig, customAppName, isCustomUserConfig = false) => {
      try {
        const appId = typeof __app_id !== 'undefined' && !isCustomUserConfig ? __app_id : (firebaseConfig.projectId || 'grande-mulia-mekarwangi');
        const existingApp = getApps().find((a) => a.name === customAppName);
        const app = existingApp || initializeApp(firebaseConfig, customAppName);

        // Aktifkan Firebase Analytics jika didukung oleh browser
        if (firebaseConfig.measurementId) {
          isAnalyticsSupported()
            .then((yes) => {
              if (yes) getAnalytics(app);
            })
            .catch(() => {});
        }

        const auth = getAuth(app);
        const db = getFirestore(app);

        window.GMM_CLOUD.mode = isCustomUserConfig ? 'Firebase Permanen (grande-mulia-mekarwangi)' : 'Cloud Environment';
        window.GMM_CLOUD.activeProjectId = firebaseConfig.projectId || appId;
        const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'gmm_master_state', 'v3_production');

        const activateCloudCallbacks = (uidLabel) => {
          window.GMM_CLOUD.ready = true;
          window.GMM_CLOUD.uid = uidLabel;
          window.GMM_CLOUD.status = `Terhubung ke ${firebaseConfig.projectId || 'grande-mulia-mekarwangi'} (AES-256)`;

          window.GMM_CLOUD.loadInitial = async () => {
            try {
              const snap = await getDoc(stateDocRef);
              if (!snap.exists()) return null;
              const rawDoc = snap.data();
              if (rawDoc.unitsData && typeof rawDoc.unitsData === 'string' && rawDoc.unitsData.startsWith('GMM_ENC_V1:')) {
                window.GMM_CLOUD.lastCipherPreview = rawDoc.unitsData.slice(0, 78) + '...';
              }
              if (rawDoc.__integrityHash) {
                window.GMM_CLOUD.lastIntegrityHash = rawDoc.__integrityHash;
              }
              return await window.GMM_CRYPTO.decryptPayloadMap(rawDoc);
            } catch (e) {
              console.warn("Info muat Cloud DB awal:", e);
              return null;
            }
          };

          window.GMM_CLOUD.saveState = async (payload, clientSyncId) => {
            try {
              const encryptedPayload = await window.GMM_CRYPTO.encryptPayloadMap(payload);
              window.GMM_CLOUD.lastCipherPreview = (encryptedPayload.unitsData || '').slice(0, 78) + '...';
              window.GMM_CLOUD.lastIntegrityHash = encryptedPayload.__integrityHash || '';

              await setDoc(stateDocRef, {
                ...encryptedPayload,
                clientSyncId: clientSyncId || '',
                updatedAt: new Date().toISOString(),
                updatedBy: auth.currentUser?.uid || uidLabel
              }, { merge: true });
              return true;
            } catch (e) {
              console.warn("Peringatan tulis Cloud DB (Pastikan Firestore Rules mengizinkan akses):", e);
              return false;
            }
          };

          window.GMM_CLOUD.subscribe = (onDataCallback, onErrorCallback) => {
            return onSnapshot(
              stateDocRef,
              async (snap) => {
                if (snap.exists()) {
                  try {
                    const rawDoc = snap.data();
                    if (rawDoc.unitsData && typeof rawDoc.unitsData === 'string' && rawDoc.unitsData.startsWith('GMM_ENC_V1:')) {
                      window.GMM_CLOUD.lastCipherPreview = rawDoc.unitsData.slice(0, 78) + '...';
                    }
                    if (rawDoc.__integrityHash) {
                      window.GMM_CLOUD.lastIntegrityHash = rawDoc.__integrityHash;
                    }
                    const decrypted = await window.GMM_CRYPTO.decryptPayloadMap(rawDoc);
                    onDataCallback(decrypted);
                  } catch (decErr) {
                    console.warn("Peringatan dekripsi snapshot:", decErr);
                  }
                }
              },
              (err) => {
                if (onErrorCallback) onErrorCallback(err);
              }
            );
          };

          window.dispatchEvent(new CustomEvent('gmm-cloud-ready'));
        };

        const initAuth = async () => {
          try {
            if (!isCustomUserConfig && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.warn("Info Auth (Jika Anonymous Auth belum diaktifkan di Firebase Console, sistem menggunakan sesi langsung):", err);
            activateCloudCallbacks('direct_session_' + (firebaseConfig.projectId || 'gmm'));
          }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
          if (user) {
            activateCloudCallbacks(user.uid);
          }
        });
        return true;
      } catch (err) {
        console.error("Gagal menginisialisasi koneksi Firebase:", err);
        return false;
      }
    };

    // Fungsi untuk menghubungkan Settingan Firebase Kustom langsung dari UI Panel Super Admin
    window.GMM_CLOUD.connectCustomFirebase = async (rawConfigInput) => {
      try {
        let parsedConfig = rawConfigInput;
        if (typeof rawConfigInput === 'string') {
          let cleaned = rawConfigInput.trim();
          // Bersihkan jika user copy-paste langsung "const firebaseConfig = { ... };" dari Firebase Console
          const firstBrace = cleaned.indexOf('{');
          const lastBrace = cleaned.lastIndexOf('}');
          if (firstBrace !== -1 && lastBrace !== -1) {
            cleaned = cleaned.slice(firstBrace, lastBrace + 1);
          }
          // Konversi key JS tanpa tanda kutip (misal apiKey: "...") menjadi JSON valid
          cleaned = cleaned.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":');
          cleaned = cleaned.replace(/,\s*}/g, '}');
          parsedConfig = JSON.parse(cleaned);
        }
        if (!parsedConfig || !parsedConfig.apiKey || !parsedConfig.projectId) {
          throw new Error('apiKey dan projectId wajib ada di dalam konfigurasi Firebase.');
        }
        const appName = 'gmm_custom_' + parsedConfig.projectId + '_' + Date.now();
        return bindCloudInstance(parsedConfig, appName, true);
      } catch (e) {
        console.error("Format konfigurasi Firebase tidak valid:", e);
        return false;
      }
    };

    try {
      const hasHardcodedCustom =
        window.CUSTOM_FIREBASE_CONFIG &&
        window.CUSTOM_FIREBASE_CONFIG.apiKey &&
        window.CUSTOM_FIREBASE_CONFIG.projectId;

      if (hasHardcodedCustom) {
        bindCloudInstance(window.CUSTOM_FIREBASE_CONFIG, 'gmm_hardcoded_custom', true);
      } else if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        const envConfig = JSON.parse(__firebase_config);
        bindCloudInstance(envConfig, 'gmm_default_env', false);
      } else {
        window.GMM_CLOUD.status = 'Siap Koneksi Firebase Kustom (Buka Panel Admin → Enkripsi & Cloud DB)';
      }
    } catch (e) {
      console.warn("Mode Cloud Standby:", e);
    }
  </script>

                    className="w-full px-3 py-2 rounded-xl border border-slate-300"
                  />
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-emerald-800 text-white font-extrabold">
                    Simpan Perubahan Unit & Komponen IPL
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ================= MODAL DETAIL UNIT ================= */}
          {selectedUnitDetail && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 space-y-3 shadow-2xl text-xs">
                <div className="flex items-center justify-between border-b pb-2">
                  <div>
                    <span className="px-2 py-0.5 rounded bg-emerald-900 text-amber-200 text-[10px] font-extrabold">{selectedUnitDetail.unit}</span>
                    <h3 className="font-extrabold text-sm text-slate-900 mt-1">{selectedUnitDetail.owner}</h3>
                  </div>
                  <button onClick={() => setSelectedUnitDetail(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1">
                  <div><strong>Status Huni:</strong> {selectedUnitDetail.statusHuni} ({selectedUnitDetail.infoKontrak})</div>
                  <div><strong>Pasangan:</strong> {selectedUnitDetail.pasangan || '-'}</div>
                  <div><strong>Jumlah Anak:</strong> {selectedUnitDetail.anakCount} Anak</div>
                  <div><strong>Komponen IPL Wajib:</strong> {formatUnitIPLBreakdown(selectedUnitDetail)} (Rp {calculateUnitIPLAmount(selectedUnitDetail).toLocaleString('id-ID')}/Bln)</div>
                  <div><strong>Jadwal Ronda GMM:</strong> {selectedUnitDetail.rondaSchedule}</div>
                  <div><strong>Kendaraan:</strong> {selectedUnitDetail.plat}</div>
                  <div><strong>WhatsApp:</strong> {selectedUnitDetail.phone}</div>
                </div>
                <div className="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                  <div className="font-extrabold text-emerald-950 mb-1">Daftar Anggota Keluarga ({selectedUnitDetail.anggotaKeluarga.length} Jiwa):</div>
                  <ul className="list-disc list-inside space-y-0.5 text-slate-700">
                    {selectedUnitDetail.anggotaKeluarga.map((ak, i) => (
                      <li key={i}>{ak}</li>
                    ))}
                  </ul>
                </div>
                <button
                  onClick={() => setSelectedUnitDetail(null)}
                  className="w-full py-2 rounded-xl bg-emerald-800 text-white font-extrabold"
                >
                  Tutup Detail Unit
                </button>
              </div>
            </div>
          )}

          {/* ================= MODAL PEMBAYARAN IURAN MULTI-CHANNEL (QRIS / BANK / DOMPET ELEKTRONIK) & KWITANSI ================= */}
          {modalQRIS && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 space-y-3.5 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <div>
                    <span className="font-extrabold text-sm text-slate-900">💳 Pembayaran Iuran IPL — {qrisSelectedMonth} {selectedBillingYear}</span>
                    <div className="text-[10px] text-slate-500">Unit: {activeBillingUnit.unit} ({activeBillingUnit.owner})</div>
                  </div>
                  <button onClick={() => setModalQRIS(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                {/* Ringkasan Nominal Sesuai Komponen Warga */}
                <div className="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-center">
                  <div className="text-[10px] font-bold text-emerald-800 uppercase">Total Tagihan Sesuai Komponen Unit Anda</div>
                  <div className="font-extrabold text-emerald-900 text-xl mt-0.5">
                    Rp {calculateUnitIPLAmount(activeBillingUnit).toLocaleString('id-ID')}
                  </div>
                  <div className="text-[11px] text-emerald-700 font-semibold mt-0.5">
                    Komponen Aktif: {formatUnitIPLBreakdown(activeBillingUnit)}
                  </div>
                </div>

                {/* Pilihan 3 Metode Pembayaran: QRIS, Transfer Bank, Dompet Elektronik */}
                <div>
                  <div className="font-extrabold text-slate-700 mb-1.5">Pilih Metode Pembayaran:</div>
                  <div className="grid grid-cols-3 gap-1.5">
                    {[
                      { id: 'QRIS', label: '📲 QRIS' },
                      { id: 'Transfer Bank', label: '🏦 Bank' },
                      { id: 'Dompet Elektronik', label: '👛 E-Wallet' }
                    ].map((ch) => (
                      <button
                        key={ch.id}
                        type="button"
                        onClick={() => setSelectedPaymentChannel(ch.id)}
                        className={`py-2 px-2 rounded-xl font-extrabold text-[11px] border transition ${
                          selectedPaymentChannel === ch.id
                            ? 'bg-emerald-800 text-white border-emerald-800 shadow-sm'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {ch.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Detail Instruksi Sesuai Metode yang Dipilih */}
                {selectedPaymentChannel === 'QRIS' && (
                  <div className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-center space-y-1.5">
                    <div className="font-extrabold text-slate-900">📲 Scan QRIS Resmi Paguyuban</div>
                    <div className="text-[11px] font-bold text-emerald-800">{appConfig.qrisMerchantName}</div>
                    <div className="text-[10px] font-mono text-slate-500">NMID: {appConfig.qrisNmid}</div>
                    <div className="text-[10px] text-slate-500">Mendukung seluruh aplikasi Mobile Banking & E-Wallet</div>
                  </div>
                )}

                {selectedPaymentChannel === 'Transfer Bank' && (
                  <div className="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 space-y-2">
                    <div className="font-extrabold text-sky-950">🏦 Transfer Rekening Bank Resmi Paguyuban</div>
                    <div className="text-xs font-bold text-slate-900">{appConfig.bankInfo}</div>
                    <button
                      type="button"
                      onClick={() => showToast(`Rekening Bank (${appConfig.bankInfo}) berhasil disalin!`)}
                      className="px-3 py-1 rounded-lg bg-sky-700 text-white text-[10px] font-extrabold"
                    >
                      📋 Salin Nomor Rekening Bank
                    </button>
                  </div>
                )}

                {selectedPaymentChannel === 'Dompet Elektronik' && (
                  <div className="p-3.5 rounded-2xl bg-purple-50 border border-purple-200 space-y-2">
                    <div className="font-extrabold text-purple-950">👛 Transfer Dompet Elektronik (DANA / OVO / GoPay / ShopeePay)</div>
                    <div className="text-xs font-bold text-slate-900">{appConfig.ewalletInfo}</div>
                    <button
                      type="button"
                      onClick={() => showToast(`Nomor Dompet Elektronik (${appConfig.ewalletInfo}) berhasil disalin!`)}
                      className="px-3 py-1 rounded-lg bg-purple-700 text-white text-[10px] font-extrabold"
                    >
                      📋 Salin Nomor Dompet Elektronik
                    </button>
                  </div>
                )}

                <label className="block p-2.5 rounded-xl bg-emerald-50 text-emerald-900 font-bold border border-emerald-200 cursor-pointer text-center">
                  📷 Upload Bukti Pembayaran ({selectedPaymentChannel})
                  <input type="file" accept="image/*" className="hidden" onChange={(e) => handleUploadImage(e, (url) => setQrisProofFoto(url))} />
                </label>
                {qrisProofFoto && <img src={qrisProofFoto} alt="Bukti" className="w-full h-28 object-cover rounded-xl" />}
                <button
                  onClick={() => {
                    handleUpdateMonthStatus(activeBillingUnit.id, selectedBillingYear, qrisSelectedMonth, 'Lunas', selectedPaymentChannel);
                    setModalQRIS(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-emerald-800 text-white font-extrabold"
                >
                  ✓ Konfirmasi Lunas via {selectedPaymentChannel}
                </button>
              </div>
            </div>
          )}

          {modalKwitansi && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 space-y-3 shadow-2xl text-xs">
                <div className="flex items-center justify-between border-b pb-2">
                  <div className="flex items-center gap-2">
                    <GMMLogo className="w-10 h-10" />
                    <div>
                      <div className="font-extrabold text-slate-900">KWITANSI RESMI IPL PAGUYUBAN GMM</div>
                      <div className="text-[10px] text-slate-500">Nomor: {modalKwitansi.id} • Versi {APP_VERSION}</div>
                    </div>
                  </div>
                  <button onClick={() => setModalKwitansi(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1">
                  <div><strong>Unit & Alamat:</strong> {modalKwitansi.unit}</div>
                  <div><strong>Nama Warga:</strong> {modalKwitansi.owner}</div>
                  <div><strong>Periode Bulan:</strong> {modalKwitansi.bulan}</div>
                  <div><strong>Komponen Dibayar:</strong> {modalKwitansi.komponen || 'Keamanan + Kebersihan + Kas'}</div>
                  <div><strong>Metode Pembayaran:</strong> {modalKwitansi.metode || 'QRIS'}</div>
                  <div><strong>Nominal Lunas:</strong> Rp {modalKwitansi.nominal.toLocaleString('id-ID')}</div>
                </div>
                <button onClick={() => window.print()} className="w-full py-2.5 rounded-xl bg-emerald-800 text-white font-extrabold">
                  🖨️ Cetak / Simpan PDF Kwitansi
                </button>
              </div>
            </div>
          )}

          {/* ================= MODAL CHANGELOG & MATRIKS ROLE & SOS ================= */}
          {activeModal === 'changelog' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-lg w-full p-5 max-h-[85vh] overflow-y-auto space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-slate-900">📋 Riwayat Pembaruan Sistem (GMM {APP_VERSION})</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                {VERSION_CHANGELOG.map((v) => (
                  <div key={v.version} className="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                    <div className="flex justify-between font-extrabold text-emerald-900">
                      <span>{v.version} — {v.type}</span>
                      <span className="text-[10px] text-slate-500">{v.date}</span>
                    </div>
                    <ul className="list-disc list-inside space-y-1 text-slate-700">
                      {v.highlights.map((h, i) => (
                        <li key={i}>{h}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeModal === 'roleinfo' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-lg w-full p-5 max-h-[85vh] overflow-y-auto space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-slate-900">🔐 Pembagian Tugas & Penguncian 4 Role</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                {Object.entries(ROLE_DEFINITIONS).map(([k, r]) => (
                  <div key={k} className="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1">
                    <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold ${r.color}`}>{r.badge}</span>
                    <div className="font-bold text-slate-900 mt-1">{r.title}</div>
                    <div className="text-slate-600"><strong>Tugas:</strong> {r.tugas}</div>
                    <div className="text-rose-700"><strong>Batasan Kunci:</strong> {r.batasan}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeModal === 'sos' && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3 shadow-2xl text-xs">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm text-rose-700">🚨 Sirine Darurat SOS ke Pos 1, Pos 2 & Pos 3</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                {['Bahaya Keamanan / Tamu Mencurigakan', 'Darurat Medis / Ambulans', 'Bahaya Kebakaran / Korsleting'].map((j) => (
                  <button
                    key={j}
                    onClick={() => {
                      setActiveModal(null);
                      showToast(`SINYAL SOS (${j}) DIKIRIM KE POS 1, POS 2 & POS 3!`);
                    }}
                    className="w-full p-3 rounded-2xl bg-rose-50 hover:bg-rose-100 border border-rose-200 font-extrabold text-rose-900 text-left"
                  >
                    🚨 {j}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* LIGHTBOX PERBESAR FOTO */}
          {lightboxImage && (
            <div onClick={() => setLightboxImage(null)} className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl max-w-xl w-full overflow-hidden shadow-2xl">
                <div className="p-3.5 flex justify-between items-center border-b">
                  <div>
                    <div className="font-extrabold text-xs text-slate-900">{lightboxImage.title}</div>
                    <div className="text-[11px] text-slate-500">{lightboxImage.caption}</div>
                  </div>
                  <button onClick={() => setLightboxImage(null)} className="px-2.5 py-1 rounded-lg bg-slate-100 font-bold text-xs">✕</button>
                </div>
                <img src={lightboxImage.url} alt={lightboxImage.title} className="w-full max-h-[70vh] object-contain bg-slate-950" />
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR (6 TAB ERGONOMIS TANPA DUPLIKASI) */}
          <nav className="fixed bottom-3 inset-x-3 z-30 max-w-4xl mx-auto bg-white/95 backdrop-blur-2xl border border-slate-200/90 rounded-3xl px-2 py-2 shadow-2xl">
            <div className="grid grid-cols-6 gap-1">
              {navTabs.map((item) => {
                const isActive = activeTab === item.id;
                const isAllowed = ROLE_DEFINITIONS[viewMode]?.allowedTabs.includes(item.id);
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`relative flex flex-col items-center justify-center py-1.5 rounded-2xl transition ${
                      isActive ? 'bg-emerald-900 text-white shadow' : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span className="text-base leading-none">{isAllowed ? item.icon : '🔒'}</span>
                    <span className="text-[10px] font-extrabold mt-1 truncate max-w-full px-1">{item.label}</span>
                    {item.badge !== null && item.badge > 0 && isAllowed && (
                      <span className="absolute top-1 right-2 px-1.5 py-0.2 rounded-full bg-amber-400 text-slate-950 text-[9px] font-extrabold">
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
