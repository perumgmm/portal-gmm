  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const STORAGE_KEY = "GMM_MASTER_STATE_V45_FINAL";
    const bc = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("gmm_realtime_channel_v45") : null;

    let db = null;
    let auth = null;
    let masterDocRef = null;
    let isCloudActive = false;

    async function initCloudEngine() {
      try {
        const rawConfig = typeof __firebase_config !== "undefined" ? __firebase_config : null;
        if (!rawConfig) return;
        const parsedConfig = typeof rawConfig === "string" ? JSON.parse(rawConfig) : rawConfig;
        if (!parsedConfig || !parsedConfig.apiKey || String(parsedConfig.apiKey).includes("PLACEHOLDER")) return;

        setLogLevel("silent");
        const app = initializeApp(parsedConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        const appId = typeof __app_id !== "undefined" && __app_id ? __app_id : "grande-mulia-mekarwangi";
        masterDocRef = doc(db, "artifacts", appId, "public", "data", "gmm_master_state", "v4_production");

        if (typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        isCloudActive = true;
      } catch (e) {
        isCloudActive = false;
      }
    }

    const readyPromise = initCloudEngine();

    window.GMM_CLOUD = {
      async loadState() {
        await readyPromise;
        let localData = null;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) localData = JSON.parse(raw);
        } catch (e) {}

        if (isCloudActive && masterDocRef) {
          try {
            const snap = await getDoc(masterDocRef);
            if (snap.exists()) {
              const cloudData = snap.data();
              if (!localData || (cloudData.updatedAt || 0) >= (localData.updatedAt || 0)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cloudData));
                return cloudData;
              }
            }
          } catch (e) {}
        }
        return localData;
      },

      async saveState(payload, onStatus) {
        const stamped = { ...payload, updatedAt: Date.now() };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stamped));
          if (bc) bc.postMessage(stamped);
        } catch (e) {}

        await readyPromise;
        if (isCloudActive && masterDocRef) {
          try {
            if (onStatus) onStatus("syncing");
            await setDoc(masterDocRef, stamped, { merge: true });
            if (onStatus) onStatus("synced");
            return true;
          } catch (e) {
            if (onStatus) onStatus("local_ready");
            return false;
          }
        } else {
          if (onStatus) onStatus("local_ready");
          return true;
        }
      },

      subscribe(callback) {
        const handleStorage = (e) => {
          if (e.key === STORAGE_KEY && e.newValue) {
            try { callback(JSON.parse(e.newValue)); } catch (err) {}
          }
        };
        window.addEventListener("storage", handleStorage);
        if (bc) bc.onmessage = (ev) => { if (ev.data) callback(ev.data); };

        let unsubFirestore = null;
        readyPromise.then(() => {
          if (isCloudActive && masterDocRef) {
            try {
              unsubFirestore = onSnapshot(masterDocRef, (snap) => {
                if (snap.exists()) {
                  const data = snap.data();
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                  callback(data);
                }
              }, () => {});
            } catch (e) {}
          }
        });

        return () => {
          window.removeEventListener("storage", handleStorage);
          if (unsubFirestore) unsubFirestore();
        };
      }
    };
  </script>

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxDim = 800;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.src = ev.target.result;

                      setPatroliList((prev) => [newPtr, ...prev]);
                      setActiveModal(null);
                      triggerSuccessPopup("Log Patroli Tercatat", `${newPtr.pos} — ${newPtr.situasi}`);
                    }}
                    className="space-y-3 text-xs"
                  >
                    <select
                      value={formPatroli.pos}
                      onChange={(e) => setFormPatroli({ ...formPatroli, pos: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      <option>Pos 1 Gerbang Utama</option>
                      <option>Pos 2 Tengah Lingkungan</option>
                      <option>Pos 3 Area Belakang</option>
                    </select>
                    <select
                      value={formPatroli.situasi}
                      onChange={(e) => setFormPatroli({ ...formPatroli, situasi: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      <option>Aman Terkendali</option>
                      <option>Portal Malam Terkunci</option>
                      <option>Perlu Perhatian / Pantauan</option>
                    </select>
                    <input
                      type="text"
                      placeholder="Nama Petugas Security / Warga"
                      value={formPatroli.petugas}
                      onChange={(e) => setFormPatroli({ ...formPatroli, petugas: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <input
                      type="text"
                      placeholder="Catatan Situasi Keamanan"
                      value={formPatroli.catatan}
                      onChange={(e) => setFormPatroli({ ...formPatroli, catatan: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <div>
                      <label className="block font-bold mb-1">📷 Foto Bukti Patroli</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={(e) => compressImageFile(e.target.files?.[0], (b64) => setFormPatroli({ ...formPatroli, foto: b64 }))}
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-emerald-800 text-white font-black">
                      Simpan Laporan Patroli
                    </button>
                  </form>
                )}

                {/* MODAL PEMINJAMAN INVENTARIS */}
                {activeModal === "inventaris" && (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const uObj = unitsData.find((u) => u.unit === formInventaris.unitPeminjam) || currentUser;
                      const finalBarang = formInventaris.namaBarang === "Lainnya (Ketik Manual)"
                        ? (formInventaris.barangManual || "Inventaris Lainnya")
                        : formInventaris.namaBarang;
                      const newInv = {
                        id: "inv-" + Date.now(),
                        tanggalISO: getLocalTodayISO(),
                        namaBarang: finalBarang,
                        jumlah: formInventaris.jumlah,
                        peminjam: uObj.owner,
                        unitPeminjam: uObj.unit,
                        waPeminjam: uObj.phone,
                        keperluan: formInventaris.keperluan,
                        tglPinjam: formInventaris.tglPinjam,
                        tglKembali: formInventaris.tglKembali,
                        status: "Dipinjam",
                        foto: formInventaris.foto
                      };
                      setInventarisList((prev) => [newInv, ...prev]);
                      setActiveModal(null);
                      triggerSuccessPopup("Peminjaman Inventaris Tercatat", `${newInv.namaBarang} oleh Unit ${newInv.unitPeminjam}`);
                    }}
                    className="space-y-3 text-xs"
                  >
                    <div>
                      <label className="block font-bold mb-1">Pilih Barang Inventaris</label>
                      <select
                        value={formInventaris.namaBarang}
                        onChange={(e) => setFormInventaris({ ...formInventaris, namaBarang: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                      >
                        {KATALOG_INVENTARIS_OPTIONS.map((k) => (
                          <option key={k.nama} value={k.nama}>{k.nama} (Stok: {k.stok})</option>
                        ))}
                      </select>
                    </div>
                    {formInventaris.namaBarang === "Lainnya (Ketik Manual)" && (
                      <input
                        type="text"
                        required
                        placeholder="Ketik Nama Barang Inventaris..."
                        value={formInventaris.barangManual}
                        onChange={(e) => setFormInventaris({ ...formInventaris, barangManual: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                      />
                    )}
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-bold mb-1">Jumlah Pinjam</label>
                        <input
                          type="text"
                          placeholder="Misal: 20 Unit"
                          value={formInventaris.jumlah}
                          onChange={(e) => setFormInventaris({ ...formInventaris, jumlah: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        />
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Unit Peminjam</label>
                        <select
                          value={formInventaris.unitPeminjam}
                          onChange={(e) => setFormInventaris({ ...formInventaris, unitPeminjam: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        >
                          {unitsData.map((u) => <option key={u.id} value={u.unit}>{u.unit} — {u.owner}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-bold mb-1">Tanggal Pinjam</label>
                        <input
                          type="date"
                          value={formInventaris.tglPinjam}
                          onChange={(e) => setFormInventaris({ ...formInventaris, tglPinjam: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        />
                      </div>
                      <div>
                        <label className="block font-bold mb-1">Estimasi Kembali</label>
                        <input
                          type="date"
                          value={formInventaris.tglKembali}
                          onChange={(e) => setFormInventaris({ ...formInventaris, tglKembali: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        />
                      </div>
                    </div>
                    <input
                      type="text"
                      placeholder="Keperluan Acara / Peminjaman"
                      value={formInventaris.keperluan}
                      onChange={(e) => setFormInventaris({ ...formInventaris, keperluan: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <div>
                      <label className="block font-bold mb-1">📷 Foto Kondisi Barang</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={(e) => compressImageFile(e.target.files?.[0], (b64) => setFormInventaris({ ...formInventaris, foto: b64 }))}
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-purple-700 text-white font-black">
                      Ajukan Peminjaman Inventaris
                    </button>
                  </form>
                )}

                {/* MODAL E-SURAT JALAN */}
                {activeModal === "surat" && (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const uObj = unitsData.find((u) => u.unit === formSurat.unit) || currentUser;
                      const newSrt = {
                        id: "srt-" + Date.now(),
                        nomorSurat: `SJ/GMM/2026/${100 + suratList.length + 1}`,
                        tanggalISO: getLocalTodayISO(),
                        namaWarga: uObj.owner,
                        unit: uObj.unit,
                        jenisSurat: formSurat.jenisSurat,
                        kendaraan: formSurat.kendaraan,
                        ket: formSurat.ket,
                        status: "Disetujui Pos 1",
                        foto: formSurat.foto
                      };
                      setSuratList((prev) => [newSrt, ...prev]);
                      setActiveModal(null);
                      triggerSuccessPopup("E-Surat Jalan Terbit", `Nomor: ${newSrt.nomorSurat}`);
                    }}
                    className="space-y-3 text-xs"
                  >
                    <select
                      value={formSurat.unit}
                      onChange={(e) => setFormSurat({ ...formSurat, unit: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      {unitsData.map((u) => <option key={u.id} value={u.unit}>{u.unit} — {u.owner}</option>)}
                    </select>
                    <select
                      value={formSurat.jenisSurat}
                      onChange={(e) => setFormSurat({ ...formSurat, jenisSurat: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      <option>Keluar Masuk Barang / Pindahan</option>
                      <option>Izin Material Renovasi Rumah</option>
                      <option>Pengiriman Furniture / Elektronik</option>
                    </select>
                    <input
                      type="text"
                      placeholder="Jenis Kendaraan Pengangkut"
                      value={formSurat.kendaraan}
                      onChange={(e) => setFormSurat({ ...formSurat, kendaraan: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <input
                      type="text"
                      required
                      placeholder="Keterangan Barang / Renovasi"
                      value={formSurat.ket}
                      onChange={(e) => setFormSurat({ ...formSurat, ket: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    />
                    <div>
                      <label className="block font-bold mb-1">📷 Upload Foto Barang / Kendaraan</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={(e) => compressImageFile(e.target.files?.[0], (b64) => setFormSurat({ ...formSurat, foto: b64 }))}
                      />
                    </div>
                    <button type="submit" className="w-full py-2.5 rounded-xl bg-rose-700 text-white font-black">
                      Terbitkan E-Surat Jalan
                    </button>
                  </form>
                )}

                {/* MODAL JADWAL SAMPAH */}
                {activeModal === "sampah" && (
                  <div className="space-y-3 text-xs">
                    {JADWAL_SAMPAH_DEFAULT.map((js, i) => (
                      <div key={i} className="p-3.5 rounded-2xl bg-lime-50 border border-lime-200 space-y-1">
                        <div className="flex items-center justify-between font-black text-lime-950">
                          <span>🗓️ {js.hari}</span>
                          <span>{js.jam}</span>
                        </div>
                        <div className="font-bold text-slate-800">Area: {js.area} ({js.petugas})</div>
                        <div className="text-slate-600">{js.catatan}</div>
                      </div>
                    ))}
                  </div>
                )}

                {/* MODAL JASA TUKANG LANGGANAN */}
                {activeModal === "tukang" && (
                  <div className="space-y-3 text-xs">
                    {JASA_TUKANG_DEFAULT.map((tk) => (
                      <div key={tk.id} className="p-3.5 rounded-2xl bg-orange-50 border border-orange-200 flex items-center justify-between gap-2">
                        <div>
                          <div className="font-black text-slate-900">{tk.nama}</div>
                          <div className="font-bold text-orange-900">{tk.keahlian}</div>
                          <div className="text-[11px] text-slate-600">Estimasi: {tk.tarif} • {tk.status}</div>
                        </div>
                        <a
                          href={`https://wa.me/62${String(tk.wa).replace(/^0/, "")}`}
                          target="_blank"
                          rel="noreferrer"
                          className="px-3 py-2 rounded-xl bg-emerald-700 text-white font-black shrink-0"
                        >
                          💬 Panggil WA
                        </a>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL E-KWITANSI RESMI */}
          {kwitansiData && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-emerald-200 animate-popup space-y-4">
                <div id="printable-area" className="space-y-3">
                  <div className="flex items-center gap-3 pb-3 border-b border-slate-200">
                    <GMMLogo customLogo={appConfig.customLogo} className="w-12 h-12" />
                    <div>
                      <div className="text-xs font-black text-emerald-900">{appConfig.namaPerumahan}</div>
                      <div className="text-[10px] text-slate-500">E-Kwitansi Resmi Pembayaran IPL Warga</div>
                    </div>
                  </div>
                  <div className="text-xs space-y-1.5">
                    <div className="flex justify-between"><span>No. Referensi:</span><strong>{kwitansiData.noRef}</strong></div>
                    <div className="flex justify-between"><span>Unit / Warga:</span><strong>{kwitansiData.unit} — {kwitansiData.owner}</strong></div>
                    <div className="flex justify-between"><span>Status Hunian:</span><strong>{kwitansiData.statusHuni} ({kwitansiData.penanggungJawab})</strong></div>
                    <div className="flex justify-between"><span>Periode IPL:</span><strong>{kwitansiData.bulan} {kwitansiData.tahun}</strong></div>
                    <div className="flex justify-between"><span>Metode Bayar:</span><strong>{kwitansiData.metode}</strong></div>
                    <div className="flex justify-between"><span>Tanggal Lunas:</span><strong>{kwitansiData.tanggal}</strong></div>
                    <div className="flex justify-between text-sm pt-2 border-t border-slate-200">
                      <span className="font-bold">Total Diterima:</span>
                      <strong className="text-emerald-800 font-black">{formatRupiah(kwitansiData.nominal)} (LUNAS)</strong>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2 pt-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-black"
                  >
                    🖨️ Cetak / Simpan PDF Kwitansi
                  </button>
                  <button
                    onClick={() => setKwitansiData(null)}
                    className="px-4 py-2.5 rounded-xl bg-slate-200 text-slate-800 text-xs font-black"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function mountGMMApp() {
      const container = document.getElementById("root");
      if (!container) return;
      if (window.ReactDOM && window.ReactDOM.createRoot) {
        const root = window.ReactDOM.createRoot(container);
        root.render(<App />);
      } else if (window.ReactDOM && window.ReactDOM.render) {
        window.ReactDOM.render(<App />, container);
      }
    }

    mountGMMApp();
  </script>
</body>
</html>
